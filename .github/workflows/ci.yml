name: BankGuard validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-lock.txt pip-audit
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m ruff check backend database
      - run: python -m pip_audit -r backend/requirements-lock.txt
      - run: npm ci && npm run lint && npm run build && npm audit
        working-directory: frontend
      - run: docker compose up --build -d --wait
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: frontend
      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            artifacts/
            frontend/playwright-report/
      - if: always()
        run: docker compose down
